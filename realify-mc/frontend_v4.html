<!-- Realify V4 SPA — parallel to frontend.html, served only when app_ui resolves 'v4' (flags.py).
     Legacy frontend.html is untouched. DLS: cool/light, all-sans. Reuses existing APIs. -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Realify</title>
<style>
:root{
  --bg:#F4F6F9; --panel:#FFFFFF; --inner:#F6F8FB; --soft:#EEF1F5;
  --line:#E7EAF0; --line-2:#EEF0F5; --ink:#14161C; --ink-2:#3B4250; --muted:#6C7482; --faint:#99A1B0;
  --accent:#2E68E6; --accent-bg:#EAF1FE; --accent-ink:#1E52C8;
  --pos:#12925A; --pos-bg:#E6F5EC; --warn:#B9770A; --warn-bg:#FBF1DC; --crit:#D8403A; --crit-bg:#FBE9E8;
  --btn:#171A22; --btn-ink:#FFFFFF; --r:14px; --r-sm:10px; --r-xs:8px;
  --shadow:0 1px 2px rgba(18,28,48,.04),0 2px 6px rgba(18,28,48,.05);
  --shadow-h:0 4px 14px rgba(18,28,48,.09);
  --rail-w:212px; --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
}
:root[data-theme="dark"]{
  --bg:#0E1014; --panel:#171A20; --inner:#1D2027; --soft:#14171D; --line:#282C34; --line-2:#22262D;
  --ink:#EDEFF3; --ink-2:#C3C8D1; --muted:#8B93A1; --faint:#666E7C; --accent:#6C97F2; --accent-bg:#1A2740;
  --accent-ink:#9DBAF8; --pos:#42C285; --pos-bg:#13291F; --warn:#E0A63F; --warn-bg:#2C2312;
  --crit:#F0625C; --crit-bg:#301715; --btn:#EDEFF3; --btn-ink:#14161C;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 2px 8px rgba(0,0,0,.35); --shadow-h:0 6px 20px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;
  font-size:14px;line-height:1.5;font-variant-numeric:tabular-nums}
a{color:var(--accent);text-decoration:none}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---- layout ---- */
.app{display:flex;min-height:100vh}
.rail{width:var(--rail-w);flex:none;border-right:1px solid var(--line);background:var(--panel);
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh;transition:width .18s}
.app.railmin .rail{width:60px}
.rail .brand{display:flex;align-items:center;padding:18px 16px 14px}
.rail .brand img{height:30px;width:auto;display:block;max-width:100%}
.logo-white{display:none}                                   /* light mode: ink wordmark on white */
:root[data-theme="dark"] .logo-ink{display:none}            /* dark mode: white wordmark */
:root[data-theme="dark"] .logo-white{display:block}
.app.railmin .brand img{display:none}                       /* collapsed rail is icon-only; wordmark won't fit */
.app.railmin .nav-lbl,.app.railmin .navsub{display:none}
.nav{display:flex;flex-direction:column;gap:2px;padding:8px}
.nav .sec{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);padding:12px 10px 5px}
.app.railmin .nav .sec{visibility:hidden}
.navitem{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:var(--r-sm);color:var(--ink-2);
  cursor:pointer;font-size:14px;font-weight:500;border:none;background:none;width:100%;text-align:left}
.navitem:hover{background:var(--inner)}
.navitem.on{background:var(--accent-bg);color:var(--accent-ink);font-weight:600}
.navitem .ic{width:19px;height:19px;flex:none;display:grid;place-items:center}
.navitem .ic svg{width:18px;height:18px}
.navsub{display:flex;flex-direction:column;margin:1px 0 3px 30px;gap:1px}
.navsub button{text-align:left;border:none;background:none;color:var(--muted);font-size:12.5px;padding:5px 8px;border-radius:6px;cursor:pointer}
.navsub button:hover{color:var(--ink)} .navsub button.on{color:var(--accent-ink);font-weight:600}
.rail .foot{margin-top:auto;padding:8px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:2px}
.rail .foot .row{display:flex;gap:6px;padding:6px 4px}
.icobtn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 9px;color:var(--muted);cursor:pointer;font-size:12px}
.icobtn:hover{color:var(--ink);border-color:var(--muted)}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.hdr{display:flex;align-items:center;gap:14px;padding:12px 22px;border-bottom:1px solid var(--line);
  background:color-mix(in srgb,var(--panel) 80%,transparent);position:sticky;top:0;z-index:20;backdrop-filter:blur(8px)}
.hdr .surface{font-size:15px;font-weight:650;letter-spacing:-.01em}
.hdr .grow{flex:1}
.omni-mini{flex:0 1 420px;display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--inner);
  border-radius:999px;padding:7px 14px;color:var(--muted);cursor:text;font-size:13px}
.omni-mini kbd{margin-left:auto;font-family:var(--mono);font-size:10.5px;border:1px solid var(--line);border-radius:5px;padding:1px 5px;background:var(--panel)}
.hbtn{border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:8px 11px;color:var(--muted);cursor:pointer;font-size:12.5px;display:inline-flex;align-items:center;gap:6px}
.hbtn:hover{color:var(--ink);border-color:var(--muted)}
.hbtn svg{width:15px;height:15px}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:600;font-size:13px;cursor:pointer;border:none}

.surface-wrap{flex:1;overflow:auto}
.pad{max-width:1000px;margin:0 auto;padding:26px 22px 80px}

/* ---- right pane ---- */
.pane{position:fixed;top:0;right:0;height:100vh;width:360px;max-width:92vw;background:var(--panel);
  border-left:1px solid var(--line);box-shadow:-8px 0 30px rgba(18,28,48,.10);transform:translateX(100%);
  transition:transform .2s;z-index:60;display:flex;flex-direction:column}
.pane.show{transform:none}
.pane .ph{display:flex;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line);font-weight:650}
.pane .ph .x{margin-left:auto;border:none;background:none;font-size:20px;color:var(--muted);cursor:pointer}
.pane .tabs{display:flex;gap:4px;padding:8px 10px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.pane .tabs button{border:1px solid transparent;background:none;color:var(--muted);border-radius:999px;padding:5px 10px;font-size:12px;cursor:pointer}
.pane .tabs button.on{background:var(--accent-bg);color:var(--accent-ink);font-weight:600}
.pane .body{flex:1;overflow:auto;padding:14px 16px}
.pane .empty{color:var(--faint);font-size:13px;text-align:center;padding:30px 10px}
.pane .li{border:1px solid var(--line);border-radius:var(--r-sm);padding:11px 12px;margin-bottom:9px;font-size:13px}
.pane .li .m{color:var(--muted);font-size:11.5px;margin-top:4px;font-family:var(--mono)}
.scrim{position:fixed;inset:0;background:rgba(15,25,45,.28);z-index:55;display:none}
.scrim.show{display:block}

/* ---- Ask ---- */
.ask-empty{max-width:720px;margin:0 auto;padding:6vh 20px 40px;text-align:center}
.logo-assemble{margin:0 auto 22px;display:block}
.logo-assemble img{height:44px;width:auto;display:block;margin:0 auto;animation:assemble .8s cubic-bezier(.2,.8,.2,1) both}
.logo-assemble .logo-white{display:none}
:root[data-theme="dark"] .logo-assemble .logo-ink{display:none}
:root[data-theme="dark"] .logo-assemble .logo-white{display:block}
@keyframes assemble{0%{opacity:0;transform:scale(.92) translateY(6px)}100%{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.logo-assemble img{animation:none}}
.ask-head{font-size:26px;font-weight:700;letter-spacing:-.02em;line-height:1.25;margin:0 0 8px;text-wrap:balance}
.ask-head .hl{color:var(--accent)}
.ask-dek{color:var(--muted);font-size:15px;margin:0 auto 26px;max-width:52ch}
.ombox{border:1.5px solid var(--line);border-radius:16px;background:var(--panel);box-shadow:var(--shadow);
  padding:4px;position:relative;overflow:hidden}
.ombox.foc{border-color:var(--accent)}
.ombox .usage{position:absolute;left:0;bottom:0;height:3px;background:var(--accent);opacity:.7;transition:width .3s}
.ombox textarea{width:100%;border:none;background:none;resize:none;font-family:inherit;font-size:15px;color:var(--ink);
  padding:13px 15px 8px;outline:none;max-height:180px}
.ombox .bar{display:flex;align-items:center;gap:8px;padding:6px 10px 8px}
.ombox .catbtn{border:1px solid var(--line);background:var(--inner);border-radius:999px;padding:5px 11px;font-size:12.5px;color:var(--ink-2);cursor:pointer}
.ombox .send{margin-left:auto;border:none;background:var(--btn);color:var(--btn-ink);border-radius:10px;width:34px;height:34px;cursor:pointer;font-size:16px}
.ombox .send:disabled{opacity:.4;cursor:not-allowed}
.modelpick{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:5px 9px;font-size:12px;color:var(--muted);cursor:pointer}
.usage-lbl{font-size:11px;color:var(--faint);font-family:var(--mono)}
.cats{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:20px}
.cat{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:8px 15px;font-size:13px;font-weight:500;color:var(--ink-2);cursor:pointer}
.cat:hover{border-color:var(--accent);color:var(--accent-ink)}
.cat.on{background:var(--accent-bg);border-color:transparent;color:var(--accent-ink);font-weight:600}
.qlist{max-width:560px;margin:16px auto 0;display:flex;flex-direction:column;gap:7px}
.q{border:1px solid var(--line);background:var(--panel);border-radius:var(--r-sm);padding:11px 14px;font-size:13.5px;text-align:left;cursor:pointer;color:var(--ink)}
.q:hover{background:var(--inner);border-color:var(--accent)}

.chat{max-width:760px;margin:0 auto;padding:20px 20px 0}
.turn{margin-bottom:22px}
.turn.u .bub{background:var(--accent-bg);color:var(--accent-ink);border-radius:14px 14px 4px 14px;padding:11px 15px;font-size:14.5px;margin-left:auto;max-width:80%;width:fit-content}
.turn.a .bub{font-size:14.5px;line-height:1.6;color:var(--ink)}
.turn.a .tiles{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}
.tile{background:var(--inner);border:1px solid var(--line-2);border-radius:var(--r-sm);padding:10px 13px;min-width:120px}
.tile.acc{background:var(--accent-bg);border-color:transparent}
.tile .tl{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin-bottom:5px}
.tile.acc .tl{color:var(--accent-ink)} .tile .tv{font-size:19px;font-weight:700;letter-spacing:-.02em}
.tile.acc .tv{color:var(--accent-ink)}
.cites{margin:10px 0;display:flex;flex-direction:column;gap:6px}
.cite{border:1px solid var(--line);border-radius:var(--r-sm);padding:9px 12px;font-size:13px;display:flex;gap:8px;align-items:center}
.cite .sev{width:8px;height:8px;border-radius:50%;flex:none}
.turn .acts{display:flex;gap:6px;margin-top:12px}
.aact{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 10px;font-size:12px;color:var(--muted);cursor:pointer;display:inline-flex;align-items:center;gap:5px}
.aact:hover{color:var(--ink);border-color:var(--muted)} .aact.on{color:var(--accent-ink);border-color:var(--accent)}
.followups{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}
.fu{border:1px dashed var(--line);border-radius:999px;padding:6px 12px;font-size:12.5px;color:var(--ink-2);cursor:pointer;background:none}
.fu:hover{border-style:solid;border-color:var(--accent);color:var(--accent-ink)}
.chatdock{position:sticky;bottom:0;background:linear-gradient(transparent,var(--bg) 24%);padding:14px 20px 20px;max-width:760px;margin:0 auto}

.placeholder{max-width:560px;margin:8vh auto;text-align:center;color:var(--muted)}
.placeholder h2{font-size:20px;color:var(--ink);font-weight:650;margin-bottom:8px}
.placeholder .badge{display:inline-block;font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--accent-ink);background:var(--accent-bg);border-radius:999px;padding:4px 11px;margin-bottom:14px}
.menu{position:absolute;background:var(--panel);border:1px solid var(--line);border-radius:var(--r-sm);box-shadow:var(--shadow-h);
  min-width:200px;padding:6px;z-index:70;font-size:13.5px}
.menu button{display:block;width:100%;text-align:left;border:none;background:none;padding:9px 11px;border-radius:7px;color:var(--ink);cursor:pointer}
.menu button:hover{background:var(--inner)}
.menu .sep{height:1px;background:var(--line);margin:5px 0}
.menu .who{padding:9px 11px;color:var(--muted);font-size:12px;line-height:1.4}

/* ---- Intel ---- */
.brief{background:var(--inner);border:1px solid var(--line);border-radius:var(--r);padding:14px 17px;margin-bottom:18px}
.brief .k{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
.brief h2{font-size:17px;font-weight:650;letter-spacing:-.01em;margin:6px 0 0;line-height:1.35}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:18px}
@media(max-width:820px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-sm);padding:12px 13px;cursor:pointer;transition:.14s}
.kpi:hover{border-color:var(--accent)} .kpi.on{border-color:var(--accent);background:var(--accent-bg)}
.kpi .kl{font-family:var(--mono);font-size:9.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--faint)}
.kpi .kv{font-size:21px;font-weight:700;letter-spacing:-.02em;margin-top:5px}
.kpi .ks{font-size:11px;color:var(--muted);margin-top:3px}
.kpi .ks.note{color:var(--warn)}
.kwin{display:flex;gap:4px;margin-left:auto}
.kwin button{border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:4px 9px;font-size:11.5px;color:var(--muted);cursor:pointer}
.kwin button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.filters{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 12px;font-size:12.5px;color:var(--ink-2);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip .fdot{width:8px;height:8px;border-radius:50%} .chip.on{background:var(--accent-bg);border-color:transparent;color:var(--accent-ink);font-weight:600}
.feedcard{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:15px 17px;margin-bottom:12px;cursor:pointer;transition:.14s}
.feedcard:hover{box-shadow:var(--shadow-h);transform:translateY(-1px)}
.feedcard .top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pill{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:4px 9px;border-radius:999px;white-space:nowrap}
.pill.crit{color:var(--crit);background:var(--crit-bg)} .pill.act{color:var(--warn);background:var(--warn-bg)}
.pill.opp{color:var(--pos);background:var(--pos-bg)} .pill.watch{color:var(--muted);background:var(--soft)}
.lens{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--ink-2)}
.lens .dot{width:8px;height:8px;border-radius:50%}
.feedcard .meta{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--faint);display:flex;gap:8px;align-items:center}
.newpill{font-family:var(--mono);font-size:9px;font-weight:700;color:var(--accent-ink);background:var(--accent-bg);border-radius:4px;padding:1px 5px}
.feedcard .finding{font-size:15px;font-weight:500;line-height:1.4;margin-top:10px;letter-spacing:-.005em}
.feedcard .exp{display:flex;gap:20px;align-items:flex-end;margin-top:11px}
.feedcard .xl{font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
.feedcard .xv{font-weight:700;color:var(--ink-2);font-size:14px;margin-top:3px}
.dots{display:flex;gap:3px;align-items:center;margin-top:5px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line)} .dots i.f{background:var(--ink-2)}
/* modal */
.mbg{position:fixed;inset:0;background:rgba(15,25,45,.4);display:none;align-items:center;justify-content:center;z-index:90;padding:20px}
.mbg.show{display:flex}
.modal{background:var(--panel);border-radius:16px;max-width:560px;width:100%;max-height:88vh;overflow:auto;box-shadow:var(--shadow-h)}
.modal .mh{display:flex;align-items:center;gap:10px;padding:16px 18px 0;flex-wrap:wrap}
.modal .mx{margin-left:auto;border:none;background:none;font-size:22px;color:var(--muted);cursor:pointer}
.modal .mt{padding:12px 18px 0;font-size:17px;font-weight:650;line-height:1.32;letter-spacing:-.01em}
.modal .mb{padding:14px 18px}
.sec-h{font-family:var(--mono);font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);margin:16px 0 8px;font-weight:600}
/* at-risk chip with no action queued yet — amber, and the word "gap" carries it too (never colour alone) */
.chip.gapchip{border-color:var(--warn);color:var(--warn)}
.chip.gapchip.on{background:var(--warn-bg);color:var(--warn);border-color:var(--warn)}
/* signal-graph neighbourhood (#4) — the SVG is wide, so IT scrolls, never the page */
.sgwrap{border:1px solid var(--line);border-radius:var(--r-sm);background:var(--panel);padding:10px 11px}
.sgscroll{overflow-x:auto;overflow-y:hidden;margin:0 -3px}
.sghead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.sgfacts{font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
/* the tone key — labelled and pushed right so it can't be mistaken for a verdict on the product */
.sgkey{display:flex;align-items:center;gap:9px;margin-left:auto;padding-left:11px;border-left:1px solid var(--line);cursor:help}
.sgkeyl{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
.sgl{font-size:11px;color:var(--muted)} .sgl b{font-size:12px}
.sgsec{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin:10px 0 5px}
.sglag{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);
  padding:6px 9px;background:var(--inner);border-radius:var(--r-xs);margin-bottom:4px}
.sglag b{color:var(--accent);cursor:help;font-size:13px}
.sgmut{font-style:normal;font-size:10.5px;color:var(--warn);margin-left:auto;white-space:nowrap}
.sgnote{font-size:11px;line-height:1.5;color:var(--faint);margin-top:9px}
.sgmuted{font-size:12px;color:var(--muted);padding:6px 2px}
.sgtab{margin-top:9px} .sgtab summary{font-size:11.5px;color:var(--accent-ink);cursor:pointer}
.sgtab table{width:100%;border-collapse:collapse;margin-top:7px;font-size:11.5px}
.sgtab th{text-align:left;font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--faint);font-weight:600;padding:4px 6px;border-bottom:1px solid var(--line)}
.sgtab td{padding:4px 6px;border-bottom:1px solid var(--line-2);color:var(--ink-2);vertical-align:top}
.box{border-radius:var(--r-sm);padding:12px 14px;font-size:13.5px;line-height:1.55;color:var(--ink-2)}
.box.neutral{background:var(--inner);border:1px solid var(--line-2)}
.mf{display:flex;gap:8px;padding:14px 18px 18px;border-top:1px solid var(--line-2);flex-wrap:wrap}
.mbtn{border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:9px 13px;font-size:13px;color:var(--muted);cursor:pointer}
.mbtn.primary{background:var(--btn);color:var(--btn-ink);border-color:transparent;font-weight:600}
.mbtn:hover{border-color:var(--muted)}
.subnav{display:flex;gap:6px;margin-bottom:18px;border-bottom:1px solid var(--line)}
.subnav button{border:none;background:none;padding:9px 4px;margin-right:12px;font-size:14px;font-weight:500;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent}
.subnav button.on{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.emptyfeed{text-align:center;color:var(--faint);padding:40px;font-size:14px}
.tiles{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0}
.fx{display:none} :root[data-adexpl="1"] .fx{display:inline}
.fxrev{display:block;margin:6px 0;background:var(--inner);border:1px solid var(--line-2);border-radius:8px;padding:8px 10px;font-size:12px;line-height:1.5;color:var(--ink-2)}
.fxrev code{font-family:var(--mono);font-size:11px;background:var(--panel);border:1px solid var(--line-2);border-radius:5px;padding:1px 5px}

/* card modal: numbers grid, research, explain, ask */

@media(max-width:520px){.mgrid{grid-template-columns:1fr 1fr}}
.mcell{background:var(--inner);border:1px solid var(--line-2);border-radius:var(--r-sm);padding:10px 12px}
.mcell .mk{font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);margin-bottom:5px;line-height:1.3}
.mcell .mv{font-size:16px;font-weight:700;letter-spacing:-.01em} .mv.pos{color:var(--pos)} .mv.neg{color:var(--crit)}
.rzbtn{border:1px solid var(--accent);background:var(--accent-bg);color:var(--accent-ink);border-radius:9px;padding:9px 14px;font-size:13px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:7px}
.rzbtn:hover{filter:brightness(1.04)} .rzbtn[disabled]{opacity:.5;cursor:not-allowed;border-color:var(--line);background:var(--inner);color:var(--muted)}
.rzchart{border:1px solid var(--line);border-radius:var(--r-sm);padding:12px 14px;margin:8px 0;background:var(--panel)}
.rzchart .ct{font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);display:flex;justify-content:space-between;margin-bottom:6px}
.crow{display:grid;grid-template-columns:26px 1fr 68px 60px 48px;gap:8px;align-items:center;padding:8px 4px;border-top:1px solid var(--line-2);font-size:12.5px}
.crow .rk{font-family:var(--mono);font-weight:700;color:var(--accent-ink)} .crow .ci{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crow .cm{font-family:var(--mono);font-size:11px;color:var(--muted);text-align:right} .crow .cs{font-family:var(--mono);font-size:11px;font-weight:700;color:var(--pos);text-align:right}
.theme{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;color:var(--ink-2);padding:5px 0}
.theme .tg{font-family:var(--mono);font-size:9.5px;padding:2px 7px;border-radius:999px;white-space:nowrap;flex:none}
.tg.positive{background:var(--pos-bg);color:var(--pos)} .tg.mixed{background:var(--soft);color:var(--muted)} .tg.watch{background:var(--warn-bg);color:var(--warn)}
.rzask{display:flex;gap:8px;margin-top:10px}
.rzask input{flex:1;border:1px solid var(--line);border-radius:9px;padding:9px 12px;font-size:13px;background:var(--panel);color:var(--ink)}
.rzask input:focus{outline:none;border-color:var(--accent)}
.rzans{margin-top:10px;background:var(--inner);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:8px;padding:11px 13px;font-size:13px;line-height:1.55;color:var(--ink-2);white-space:pre-wrap}
.rzans.think{color:var(--faint);font-family:var(--mono);font-size:12px}
.xpanel{background:var(--inner);border:1px solid var(--line-2);border-radius:var(--r-sm);padding:12px 14px;margin-top:8px;font-size:12.5px;line-height:1.5}
.xpanel .xk{font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);margin:10px 0 4px} .xpanel .xk:first-child{margin-top:0}
.xpanel code{font-family:var(--mono);font-size:11.5px;background:var(--panel);border:1px solid var(--line-2);border-radius:5px;padding:1px 5px}
@media(max-width:720px){.rail{position:fixed;z-index:80;transform:translateX(-100%)}.app.railopen .rail{transform:none}.omni-mini{display:none}}

/* ================= ASK: conversation rail, markdown, agent trace ================= */
.askwrap{display:flex;align-items:flex-start;min-height:calc(100vh - 58px)}
.convbar{width:250px;flex:none;border-right:1px solid var(--line);background:var(--panel);
  position:sticky;top:0;height:calc(100vh - 58px);display:flex;flex-direction:column}
.convbar.hide{display:none}
.convbar .cvhd{padding:12px 12px 8px}
.newchat{width:100%;display:flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);
  background:var(--inner);border-radius:var(--r-sm);padding:9px 12px;font-size:13px;font-weight:600;
  color:var(--ink);cursor:pointer;font-family:inherit}
.newchat:hover{border-color:var(--accent);color:var(--accent-ink)}
.convsearch{display:block;margin:0 12px 6px;border:1px solid var(--line);background:var(--inner);border-radius:8px;
  padding:7px 10px;font-size:12.5px;color:var(--ink);font-family:inherit;width:calc(100% - 24px)}
.convsearch:focus{outline:none;border-color:var(--accent)}
.convlist{flex:1;overflow:auto;padding:0 8px 12px}
.convlist .grp{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--faint);padding:12px 8px 5px}
.convitem{display:flex;align-items:center;gap:6px;padding:8px 9px;border-radius:8px;cursor:pointer;color:var(--ink-2);font-size:13px}
.convitem:hover{background:var(--inner)}
.convitem.on{background:var(--accent-bg);color:var(--accent-ink);font-weight:600}
.convitem .ct{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.convitem .cx{opacity:0;border:none;background:none;color:var(--muted);cursor:pointer;font-size:16px;line-height:1;padding:0 3px;border-radius:5px}
.convitem:hover .cx{opacity:1} .convitem .cx:hover{color:var(--crit)}
.askmain{flex:1;min-width:0;display:flex;flex-direction:column}
.convtog{border:1px solid var(--line);background:var(--panel);border-radius:8px;color:var(--muted);cursor:pointer;padding:7px 9px;font-size:12px}

/* markdown inside answer bubbles */
.turn.a .bub h1,.turn.a .bub h2,.turn.a .bub h3,.turn.a .bub h4{margin:14px 0 7px;line-height:1.3;font-weight:680;font-size:1.03em}
.turn.a .bub p{margin:8px 0} .turn.a .bub>:first-child{margin-top:0} .turn.a .bub>:last-child{margin-bottom:0}
.turn.a .bub ul,.turn.a .bub ol{margin:8px 0;padding-left:22px} .turn.a .bub li{margin:3px 0}
.turn.a .bub strong{font-weight:680;color:var(--ink)}
.turn.a .bub code{background:var(--inner);border:1px solid var(--line-2);border-radius:5px;padding:1px 5px;font-family:var(--mono);font-size:.87em}
.turn.a .bub hr{border:0;border-top:1px solid var(--line);margin:12px 0}
.turn.a .bub blockquote{margin:9px 0;padding:5px 12px;border-left:3px solid var(--line);color:var(--muted)}
.turn.a .bub table{border-collapse:collapse;margin:10px 0;width:100%;font-size:.92em;display:block;overflow-x:auto}
.turn.a .bub th,.turn.a .bub td{border:1px solid var(--line);padding:6px 9px;text-align:left;vertical-align:top}
.turn.a .bub thead th{background:var(--inner);font-weight:650}
.codewrap{position:relative;margin:10px 0}
.codewrap pre{background:var(--inner);border:1px solid var(--line-2);border-radius:var(--r-sm);padding:11px 12px;
  overflow-x:auto;margin:0;font-family:var(--mono);font-size:12px;line-height:1.55;color:var(--ink-2)}
.codecopy{position:absolute;top:7px;right:7px;border:1px solid var(--line);background:var(--panel);border-radius:6px;
  padding:3px 7px;font-size:11px;color:var(--muted);cursor:pointer;opacity:0;transition:opacity .15s;font-family:inherit}
.codewrap:hover .codecopy{opacity:1} .codecopy:hover{color:var(--ink)}

/* live status + streaming cursor */
.statusline{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px;margin:2px 0 9px}
.statusline .sp{width:11px;height:11px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:aspin .7s linear infinite;flex:none}
@keyframes aspin{to{transform:rotate(360deg)}}
.curs{display:inline-block;width:7px;height:15px;background:var(--accent);vertical-align:-2px;margin-left:2px;animation:ablink 1s step-end infinite}
@keyframes ablink{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){.statusline .sp,.curs{animation:none}}

/* agent trace — the tool calls and the SQL the agent actually ran */
.trace{border:1px solid var(--line);border-radius:var(--r-sm);margin:11px 0;background:var(--panel);overflow:hidden}
.trace-hd{display:flex;align-items:center;gap:8px;padding:9px 12px;cursor:pointer;font-size:12.5px;color:var(--ink-2);user-select:none}
.trace-hd:hover{background:var(--inner)}
.trace-hd .cv{margin-left:auto;color:var(--faint);font-size:11px;transition:transform .15s}
.trace.open .trace-hd .cv{transform:rotate(90deg)}
.trace-bd{display:none;border-top:1px solid var(--line-2);padding:10px 12px}
.trace.open .trace-bd{display:block}
.tstep{font-size:12px;color:var(--muted);padding:3px 0}
.tstep b{color:var(--ink-2);font-weight:600}
.sqlblock{background:var(--inner);border:1px solid var(--line-2);border-radius:8px;padding:9px 10px;margin:7px 0 3px;
  font-family:var(--mono);font-size:11.5px;line-height:1.5;color:var(--ink-2);overflow-x:auto;white-space:pre-wrap;word-break:break-word}
.tmeta{font-family:var(--mono);font-size:10.5px;color:var(--faint);letter-spacing:.04em}

/* confidence badge — the grounding gate's verdict */
.conf{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:999px;
  padding:5px 11px;font-size:11.5px;color:var(--muted);margin-top:10px}
.conf .dot{width:7px;height:7px;border-radius:50%;flex:none}
.conf b{color:var(--ink-2);font-weight:650}

/* composer extras + jump-to-latest */
.jumpb{position:sticky;bottom:6px;margin:0 auto;display:block;border:1px solid var(--line);background:var(--panel);
  box-shadow:var(--shadow-h);border-radius:999px;padding:6px 13px;font-size:12px;color:var(--ink-2);cursor:pointer;z-index:5}
.ombox .stop{margin-left:auto;border:none;background:var(--crit);color:#fff;border-radius:10px;padding:0 13px;height:34px;cursor:pointer;font-size:12.5px;font-weight:600;font-family:inherit}
.ombox .icobtn{border:1px solid var(--line);background:var(--panel);border-radius:10px;width:34px;height:34px;cursor:pointer;font-size:14px;color:var(--ink-2);flex:none}
.ombox .icobtn:hover{border-color:var(--accent)}
.ombox .icobtn.rec{background:var(--crit);border-color:var(--crit);color:#fff}
.ombox .icobtn[aria-pressed="true"]{background:var(--accent-bg);border-color:transparent;color:var(--accent-ink)}
@media (max-width:900px){.convbar{display:none}}
</style>

<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
let ME={}, MODELS=[], MODEL_ID=null, USAGE={pct:0,used:0,cap:100};

const RAIL=[
  {k:'ask',label:'Ask',ic:'M12 3a9 9 0 1 0 4.5 16.8L21 21l-1.2-4.5A9 9 0 0 0 12 3z'},
  {k:'intel',label:'Intel',ic:'M4 18l5-6 4 4 7-9',sub:[['intelligence','Intelligence'],['risk','Why a SKU is at risk'],['catalog','Product Catalog'],['analyst','Category Analyst'],['channels','Channels']]},
  {k:'ads',label:'Ads',ic:'M3 12h4l3-8 4 16 3-8h4'},
  {k:'agents',label:'Agents',ic:'M12 2l2.4 4.9 5.4.8-3.9 3.8.9 5.4L12 19l-4.8 2.5.9-5.4L4.2 12.3l5.4-.8z',sub:[['roster','Your workforce'],['ledger','Autonomy Ledger'],['hire','Hire a specialist']]},
];
const FOOT=[
  {k:'settings',label:'Settings',ic:'M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM19 12a7 7 0 0 0-.1-1l2-1.6-2-3.4-2.4 1a7 7 0 0 0-1.7-1L14.5 3h-5l-.3 2.4a7 7 0 0 0-1.7 1l-2.4-1-2 3.4L2.9 11a7 7 0 0 0 0 2l-2 1.6 2 3.4 2.4-1a7 7 0 0 0 1.7 1l.3 2.4h5l.3-2.4a7 7 0 0 0 1.7-1l2.4 1 2-3.4-2-1.6a7 7 0 0 0 .1-1z'},
  {k:'integrations',label:'Integrations',ic:'M10 3v4M14 3v4M6 7h12l-1 5a5 5 0 0 1-10 0z M12 17v4'},
];
let SURFACE='ask', SUB={intel:'intelligence',agents:'roster'};

function icon(d){return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="${d}"/></svg>`}

function railItems(){
  // forward features (Ask, Agents) appear only when their gate is on; Intel/Ads always present.
  const feat=ME.features||{};
  return RAIL.filter(r=>!( (r.k==='ask'&&feat.ask===false) || (r.k==='agents'&&feat.agents===false) ));
}
function renderRail(){
  $('#nav').innerHTML = railItems().map(r=>{
    const on = SURFACE===r.k?'on':'';
    let h = `<button class="navitem ${on}" data-k="${r.k}"><span class="ic">${icon(r.ic)}</span><span class="nav-lbl">${r.label}</span></button>`;
    if(r.sub && SURFACE===r.k) h += `<div class="navsub">`+r.sub.map(([sk,sl])=>`<button data-sub="${sk}" data-subk="${r.k}" class="${(SUB[r.k]===sk)?'on':''}">${sl}</button>`).join('')+`</div>`;
    return h;
  }).join('');
  $('#navfoot').innerHTML = FOOT.map(r=>`<button class="navitem ${SURFACE===r.k?'on':''}" data-k="${r.k}"><span class="ic">${icon(r.ic)}</span><span class="nav-lbl">${r.label}</span></button>`).join('');
  $$('#nav [data-k],#navfoot [data-k]').forEach(b=>b.onclick=()=>go(b.dataset.k));
  $$('#nav [data-sub]').forEach(b=>b.onclick=()=>{SUB[b.dataset.subk]=b.dataset.sub; go(b.dataset.subk);});
}
function go(k){ SURFACE=k; $('#surfaceName').textContent = ({ask:'Ask',intel:'Intel',ads:'Ads',agents:'Agents',settings:'Settings',integrations:'Integrations'})[k]||k;
  renderRail(); renderSurface(); if(innerWidth<=720) $('#app').classList.remove('railopen'); }

function renderSurface(){
  const el=$('#surface');
  if(SURFACE==='ask') return renderAsk(el);
  if(SURFACE==='intel') return renderIntel(el);
  if(SURFACE==='ads') return renderAds(el);
  if(SURFACE==='settings') return renderSettings(el);
  if(SURFACE==='integrations') return renderIntegrations(el);
  if(SURFACE==='agents') return renderAgents(el);
  el.innerHTML = `<div class="placeholder"><h2>${esc(SURFACE)}</h2></div>`;
}

/* ============ AGENTS ============ */
const AUT_COLOR={observe:'watch',suggest:'watch',assist:'act',act:'opp'};
const STATE_COLOR={applied:'opp',awaiting:'act',handoff:'watch',held:'watch'};
async function renderAgents(el){
  const view=SUB.agents||'roster';
  el.innerHTML=`<div class="pad" id="agPad"><div class="emptyfeed">Loading your workforce…</div></div>`;
  const pad=$('#agPad');
  if(view==='ledger') return agLedger(pad);
  const d=await fetch('/api/agents').then(r=>r.json()).catch(()=>({agents:[],specialists:[]}));
  if(view==='hire') return agHire(pad, d);
  // roster
  const agents=d.agents||[];
  pad.innerHTML=`<div style="display:flex;align-items:center;margin-bottom:16px">
      <div><div class="ask-head" style="font-size:22px;margin:0">Your workforce</div>
      <div style="color:var(--muted);font-size:13.5px;margin-top:4px">AI specialists that watch your data and act within your guardrails. ${d.feature_on?'':'<span class="pill watch">Observe mode — acting is off until enabled</span>'}</div></div>
      <button class="mbtn primary" id="hireBtn" style="margin-left:auto">＋ Hire a specialist</button></div>`;
  if(!agents.length){
    pad.innerHTML+=`<div class="emptyfeed">No specialists on your team yet.<br><br><button class="mbtn primary" id="hire2">Hire your first specialist →</button></div>`;
    $('#hire2') && ($('#hire2').onclick=()=>{SUB.agents='hire';go('agents');});
  } else {
    pad.innerHTML+=agents.map(a=>{
      const spec=(d.specialists||[]).find(s=>s.id===a.specialist)||{};
      return `<div class="feedcard" data-agent="${a.id}"><div class="top">
        <span class="lens"><span class="dot" style="background:var(--accent)"></span>${esc(a.name)}</span>
        <span class="meta"><span class="pill ${AUT_COLOR[a.autonomy]||'watch'}">${esc(a.autonomy)}</span>
          <span class="pill ${a.status==='active'?'opp':'watch'}">${esc(a.status)}</span></span></div>
        <div style="color:var(--muted);font-size:13px;margin-top:9px">${esc(spec.tagline||'')}</div>
        <div style="font-family:var(--mono);font-size:11px;color:var(--faint);margin-top:8px">${a.task_count||0} task${a.task_count===1?'':'s'} · ${(a.guardrails||[]).length} guardrails</div></div>`;
    }).join('');
    $$('#agPad [data-agent]').forEach(c=>c.onclick=()=>openAgent(c.dataset.agent));
  }
  const hb=$('#hireBtn'); if(hb) hb.onclick=()=>{SUB.agents='hire';go('agents');};
}
function agHire(pad, d){
  pad.innerHTML=`<div class="brief"><span class="k">Onboard a specialist</span><h2>Add a teammate to your workforce</h2></div>
    <div style="color:var(--muted);font-size:13.5px;margin-bottom:16px">Each starts in <b>Observe</b> — it watches and recommends, and acts on nothing until you promote it. You set scope, autonomy, and guardrails after hiring.</div>
    ${(d.specialists||[]).map(s=>`<div class="feedcard" data-spec="${s.id}"><div class="top">
      <span class="lens">${esc(s.name)}</span>${s.flagship?'<span class="pill opp">Flagship</span>':''}
      <span class="meta"><button class="mbtn primary" data-hire="${s.id}">Hire</button></span></div>
      <div style="color:var(--muted);font-size:13px;margin-top:9px">${esc(s.tagline)}</div>
      ${s.clocks?`<div style="font-family:var(--mono);font-size:10.5px;color:var(--faint);margin-top:8px">Four clocks · Five signals · ITL-ARB-01</div>`:''}</div>`).join('')}`;
  $$('#agPad [data-hire]').forEach(b=>b.onclick=async(e)=>{ e.stopPropagation();
    b.textContent='Hiring…'; const r=await fetch('/api/agents',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({specialist:b.dataset.hire})}).then(x=>x.json());
    if(r.ok){ SUB.agents='roster'; go('agents'); } else { b.textContent='Hire'; alert(r.error||'Failed'); } });
}
async function openAgent(id){
  const r=await fetch('/api/agents/'+id).then(x=>x.json()); if(!r.ok) return; const a=r.agent, spec=a.spec||{};
  let tab='overview';
  const paint=()=>{
    const tabs=['overview','instructions','guardrails','tasks','activity'];
    const body=tab==='overview'?agOverview(a,spec):tab==='guardrails'?agGuard(a):tab==='tasks'?agTasks(a):tab==='instructions'?agInstr(a,spec):agActivity(a);
    $('#modalHost').innerHTML=`<div class="mbg show" id="agModal"><div class="modal" style="max-width:620px">
      <div class="mh"><span class="lens"><span class="dot" style="background:var(--accent)"></span>${esc(a.name)}</span>
        <span class="pill ${AUT_COLOR[a.autonomy]||'watch'}">${esc(a.autonomy)}</span>
        <button class="mx" data-x>&times;</button></div>
      <div class="subnav" style="padding:0 18px;margin:8px 0 0">${tabs.map(t=>`<button class="${tab===t?'on':''}" data-tab="${t}">${t[0].toUpperCase()+t.slice(1)}</button>`).join('')}</div>
      <div class="mb">${body}</div>
      <div class="mf"><button class="mbtn" data-x2>Close</button><div style="flex:1"></div>
        <button class="mbtn" id="pauseBtn">${a.status==='active'?'Pause':'Resume'}</button></div></div></div>`;
    const host=$('#agModal'); const close=()=>host.remove();
    host.querySelector('[data-x]').onclick=close; host.querySelector('[data-x2]').onclick=close;
    host.onclick=e=>{ if(e.target===host) close(); };

/* ── WHY A SKU IS AT RISK — ported from the legacy shell into V4 ────────────────────────────────
   /api/at-risk ranks SKUs on live signals (margin, rating, returns, velocity, competitor undercutting)
   and flags PROACTIVE GAPS: at risk with no action queued yet. Clicking one calls /api/diagnose for the
   conclusion, then renders the signal-graph neighbourhood underneath it as the evidence.

   The V4 port is not a copy of the legacy markup. Legacy shows the diagnosis as prose plus a grouped
   list because that shell has no CSS custom properties; here the same evidence goes through sgHTML(),
   the SVG renderer the SKU drawer already uses — so the conclusion and the graph it came from sit
   together, which is the whole point of building the neighbourhood view. */
let RISK_ROWS=[];
async function renderRisk(body){
  body.innerHTML='<div class="emptyfeed">Ranking your catalog on live signals…</div>';
  let d=null;
  try{ d=await fetch('/api/at-risk?limit=10',{credentials:'same-origin'}).then(r=>r.json()); }catch(e){}
  if(!d||!d.ok||!(d.at_risk||[]).length){
    body.innerHTML=`<div class="emptyfeed">${esc((d&&d.error)||'No at-risk SKUs right now — nothing is tripping the signal thresholds.')}</div>`;
    return;
  }
  RISK_ROWS=d.at_risk||[];
  const gaps=(d.proactive_gaps||[]).length;
  body.innerHTML=`
    <div class="brief"><span class="k">Live risk readout</span>
      <h2>Why a SKU is at risk${gaps?` — ${gaps} with no action queued`:''}</h2></div>
    <div style="font-size:13px;color:var(--muted);margin:-4px 0 12px;line-height:1.55">
      Ranked on live signals — margin, rating, returns, velocity and competitor undercutting — each with a
      concrete next action. <b style="color:var(--warn)">Amber</b> means at risk with nothing queued yet.
    </div>
    <div class="filters" id="riskChips">${RISK_ROWS.map((r,i)=>{
      const gap=(r.recs===0);
      return `<button class="chip${gap?' gapchip':''}" data-rix="${i}" title="${esc(r.title||'')}">
        <span style="font-family:var(--mono);font-size:11.5px">${esc(r.sku)}</span>
        <span style="opacity:.7;margin-left:5px">risk ${r.risk_score||0}</span>
        ${gap?'<span style="color:var(--warn);margin-left:5px">· gap</span>':''}</button>`;}).join('')}</div>
    <div id="riskDetail"><div class="emptyfeed" style="padding:22px 0">Pick a SKU to see why it's flagged, what to do, and the graph the diagnosis came from.</div></div>`;
  $$('#riskChips [data-rix]').forEach(c=>c.onclick=()=>riskDiagnose(RISK_ROWS[+c.dataset.rix], c));
}
async function riskDiagnose(row, chip){
  const host=$('#riskDetail'); if(!host||!row) return;
  $$('#riskChips .chip').forEach(c=>c.classList.remove('on')); if(chip) chip.classList.add('on');
  host.innerHTML=`<div class="emptyfeed" style="padding:18px 0">Tracing ${esc(row.sku)} through the signal graph…</div>`;
  let d=null;
  try{ d=await fetch('/api/diagnose?sku='+encodeURIComponent(row.sku),{credentials:'same-origin'}).then(r=>r.json()); }catch(e){}
  if(!host.isConnected) return;
  if(!d||!d.ok){ host.innerHTML=`<div class="box neutral" style="color:var(--crit)">${esc((d&&d.error)||('No diagnosis for '+row.sku))}</div>`; return; }
  const sym=_sym(), money=v=>v==null?'—':sym+Math.round(v).toLocaleString('en-IN');
  const facts=[d.price!=null?'price '+money(d.price):'', d.margin!=null?'margin '+Math.round(d.margin)+'%':'',
    d.buybox!=null?'Buy Box '+Math.round(d.buybox)+'%':'', d.category||'',
    d.cohort_peers?d.cohort_peers+' cohort peers':''].filter(Boolean).join(' · ');
  const rf=d.risk_factors||[], uc=d.undercutters||[];
  host.innerHTML=`
    <div class="feedcard" style="cursor:default">
      <div class="top"><span class="pill ${rf.length?'act':'opp'}">${rf.length?'at risk':'healthy'}</span>
        <span class="lens">${esc(d.title||d.sku)}</span></div>
      ${facts?`<div style="font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:6px">${esc(facts)}</div>`:''}
      ${rf.length?`<div class="sec-h">Why it's at risk</div>${rf.map(f=>`<div class="cite">
          <span class="sev" style="background:${f.sev>=2?'var(--crit)':'var(--warn)'}"></span>
          <span><b>${esc(f.label)}</b> <span style="color:var(--faint)">· ${esc(f.value)}</span></span></div>`).join('')}`
        :`<div class="sec-h">Status</div><div class="cite"><span style="color:var(--pos)">No risk factors — this SKU looks healthy.</span></div>`}
      ${uc.length?`<div class="sec-h">Competitors undercutting (${uc.length})</div>${uc.slice(0,5).map(u=>`<div class="cite">
          <span><b>${esc(u.seller||'rival')}</b>${u.price!=null?' at '+money(u.price):''}</span>
          ${u.gap!=null?`<b style="margin-left:auto;color:var(--crit)">${money(u.gap)} below you</b>`:''}</div>`).join('')}`:''}
      ${d.action?`<div class="sec-h">Recommended action</div><div class="box" style="background:var(--pos-bg);font-size:13px">${esc(d.action)}</div>`:''}
      <div class="sec-h">The evidence behind this — live signal graph</div>
      <div id="riskGraph" class="sgwrap"><div class="sgmuted">Loading the neighbourhood…</div></div>
    </div>`;
  loadSkuGraph(row.sku, $('#riskGraph'));       // same SVG renderer the SKU drawer uses
}
async function renderIntelFeed(body){

/* ONE FUNDED REORDER PLAN (family #9, Cash) — the same allocator the classic Intelligence panel uses,
   rendered in the V4 DLS. Independent of the feed: it loads async and stays silent on failure, so a slow
   or absent allocator never blocks the signals below it. Shell-agnostic API: /api/reorder-plan +
   /api/cash-budget. */
async function renderFundedPlan(){
  const host=$('#v4Plan'); if(!host) return;
  let p=null, cb=null;
  try{
    const [pR,bR]=await Promise.all([
      fetch('/api/reorder-plan',{credentials:'same-origin'}),
      fetch('/api/cash-budget',{credentials:'same-origin'})]);
    p=pR.ok?await pR.json():null; cb=bR.ok?await bR.json():null;
  }catch(e){ host.innerHTML=''; return; }
  if(!p||(!p.ok&&!p.needs_budget)){ host.innerHTML=''; return; }
  const sym=ME.symbol||'₹';
  const inr=v=>sym+Math.round(v||0).toLocaleString('en-IN');

  if(p.needs_budget){
    const sug=cb&&cb.suggested?cb.suggested:null;
    host.innerHTML=`<div class="feedcard" style="cursor:default">
      <div class="top"><span class="pill watch">cash</span>
        <span class="lens">Fund your reorders — one plan, not many separate asks</span></div>
      <div class="finding" style="margin-top:8px;color:var(--ink-2);font-size:13.5px;line-height:1.55">
        Each reorder suggestion is sized on its own, so together they can ask for more cash than you have.
        Tell us your inventory budget and we'll spread it across SKUs to protect the most profit.</div>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:11px">
        <label style="font-size:12.5px;color:var(--muted)">Inventory budget ${sym}</label>
        <input id="v4Cash" type="number" min="1" step="1000" value="${sug||''}"
          style="width:160px;padding:8px 10px;border:1px solid var(--line);background:var(--inner);
                 border-radius:9px;font-size:13px;color:var(--ink);font-family:inherit">
        <button class="mbtn primary" id="v4CashSave">Build the plan</button>
        ${sug?`<span style="font-size:11.5px;color:var(--faint)">suggested ${inr(sug)} — the cost of replacing what you sold last month</span>`:''}
      </div></div>`;
    const b=$('#v4CashSave');
    if(b) b.onclick=async()=>{
      const v=parseFloat(($('#v4Cash')||{}).value); if(!v||v<=0) return;
      b.disabled=true; b.textContent='Building…';
      try{ await fetch('/api/cash-budget',{method:'POST',credentials:'same-origin',
            headers:{'Content-Type':'application/json'},body:JSON.stringify({value:v})});
        renderFundedPlan();
      }catch(e){ b.disabled=false; b.textContent='Build the plan'; }
    };
    return;
  }

  const v=p.vs_rule||{}, lines=p.plan||[];
  const tone=d=>d>0?'var(--pos)':(d<0?'var(--warn)':'var(--faint)');
  host.innerHTML=`<div class="feedcard" style="cursor:default">
    <div class="top"><span class="pill opp">cash</span>
      <span class="lens">Your funded reorder plan</span>
      <span class="meta"><span class="pill watch" title="${esc(p.basis||'')}">${inr(p.cash_committed)} of ${inr(p.cash_budget)}</span>
        <span class="pill watch">${p.horizon_days}-day cover</span></span></div>
    ${(v.improvement_pct!=null&&v.improvement>0)?`<div class="finding" style="margin-top:8px;font-size:13.5px;line-height:1.55">
      Spreading the money across SKUs instead of funding them one at a time cuts worst-case lost margin by
      <b>${inr(v.improvement)} (${v.improvement_pct}%)</b> — same budget.</div>`:''}
    <div style="overflow-x:auto;margin-top:10px">
    <table style="width:100%;border-collapse:collapse;font-size:12.5px">
      <thead><tr>
        ${['SKU','Order','Cash','On hand',p.horizon_days+'-day demand','vs one-at-a-time'].map((h,i)=>
          `<th style="text-align:${i?'right':'left'};padding:6px 8px;border-bottom:1px solid var(--line);
             font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;
             color:var(--faint);font-weight:600;white-space:nowrap">${esc(h)}</th>`).join('')}
      </tr></thead><tbody>
      ${lines.map(l=>`<tr>
        <td style="padding:7px 8px;border-bottom:1px solid var(--line-2)">
          <span style="font-family:var(--mono);font-size:11.5px">${esc(l.internal_sku)}</span>
          <div style="font-size:11px;color:var(--faint)">${esc((l.title||'').slice(0,46))}</div></td>
        <td style="text-align:right;padding:7px 8px;border-bottom:1px solid var(--line-2);font-variant-numeric:tabular-nums"><b>${l.order_qty}</b></td>
        <td style="text-align:right;padding:7px 8px;border-bottom:1px solid var(--line-2);font-variant-numeric:tabular-nums">${inr(l.cash)}</td>

        <td style="text-align:right;padding:7px 8px;border-bottom:1px solid var(--line-2);font-variant-numeric:tabular-nums">${l.mean_demand_horizon}</td>
        <td style="text-align:right;padding:7px 8px;border-bottom:1px solid var(--line-2);font-variant-numeric:tabular-nums;color:${tone(l.delta_vs_rule)}">${l.delta_vs_rule>0?'+':''}${l.delta_vs_rule}</td>
      </tr>`).join('')}
      </tbody></table></div>
    ${p.unconstrained_ask>p.cash_budget?`<div style="font-size:11.5px;color:var(--faint);margin-top:8px">
      Fully covering ${p.horizon_days} days would need ${inr(p.unconstrained_ask)} — ${(p.unconstrained_ask/p.cash_budget).toFixed(1)}× this budget.
      The plan spends what you have where it protects the most margin.</div>`:''}
    ${(p.excluded_loss_making||[]).length?`<div style="font-size:11.5px;color:var(--warn);margin-top:6px">
      Left out ${p.excluded_loss_making.length} SKU(s) that sell but lose money per unit — restocking them destroys margin.</div>`:''}
    ${(p.caveats||[]).length?`<details style="margin-top:9px">
      <summary style="cursor:pointer;font-size:11.5px;color:var(--muted)">What this plan does not know</summary>
      <ul style="margin:6px 0 0;padding-left:18px;font-size:11.5px;color:var(--muted);line-height:1.6">
        ${p.caveats.map(c=>`<li>${esc(c)}</li>`).join('')}</ul></details>`:''}
    <div style="margin-top:10px"><button class="mbtn" id="v4CashEdit">Change budget</button></div>
  </div>`;
  const e=$('#v4CashEdit');
  if(e) e.onclick=async()=>{
    const val=parseFloat(prompt('Inventory cash budget ('+sym+'):', p.cash_budget));

    await fetch('/api/cash-budget',{method:'POST',credentials:'same-origin',
      headers:{'Content-Type':'application/json'},body:JSON.stringify({value:val})});

  };
}

function _spark(series,color){
  const pts=(series||[]).map(p=>typeof p==='object'?(p.v!=null?p.v:p.value):p).filter(v=>v!=null);
  if(pts.length<2) return '';
  const W=260,H=54,pad=4,max=Math.max(...pts),min=Math.min(...pts),rng=(max-min)||1,step=(W-2*pad)/(pts.length-1);
  const xy=pts.map((v,i)=>[pad+i*step,H-pad-((v-min)/rng)*(H-2*pad)]);
  return `<svg width="100%" height="${H}" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><polyline points="${xy.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ')}" fill="none" stroke="${color}" stroke-width="1.8" stroke-linejoin="round"/><circle cx="${xy[xy.length-1][0].toFixed(1)}" cy="${xy[xy.length-1][1].toFixed(1)}" r="2.4" fill="${color}"/></svg>`;
}

/* The held ads model's response, fetched ONCE per page life and reused by every SKU modal — the
   allocator block-bootstraps each SKU and solves four LPs, so re-running it per modal open would be
   wasteful and would make the pop-up feel slow. Null when the gate is off or the call fails. */
let ADPLAN=null, ADPLAN_TRIED=false;
async function adPlanOnce(){
  if(ADPLAN_TRIED) return ADPLAN;

  try{ const d=await fetch('/api/ad-budget-plan?alpha=0.9',{credentials:'same-origin'}).then(r=>r.json());
       ADPLAN=(d&&d.ok)?d:null; }catch(e){ ADPLAN=null; }

/* What the model actually says about THIS SKU, shown with the two flags that discredit it rather than
   the number alone. Renders nothing at all when the gate is off. */
function adModelHTML(sku, plan){
  if(!plan) return '';
  const sym=_sym(), inr=v=>sym+Math.round(v||0).toLocaleString('en-IN');

  const held=(plan.held||[]).find(x=>x.sku===sku);
  const head=`<div class="sec-h" style="color:var(--warn)">Held ads model — internal only, not validated</div>`;
  if(!r){
    return head+`<div class="box" style="border:1px solid var(--warn);background:var(--warn-bg);font-size:12.5px;line-height:1.55">
      ${held?`<b>No response could be estimated for this SKU.</b> ${esc(held.reason)}.

       :`<b>This SKU is not in the model's window.</b> It carries no daily ad spend in the period the

  return head+`<div class="box" style="border:1px solid var(--warn);background:var(--warn-bg)">
    <div class="tiles" style="margin-bottom:2px">

        <div class="tv" style="font-size:17px;color:${r.implausible_return?'var(--crit)':'var(--ink)'}">${sym}${r.return_per_rupee.toFixed(2)}</div></div>

        <div class="tv" style="font-size:17px;color:${r.model_worse_than_baseline?'var(--crit)':'var(--pos)'}">${r.holdout_skill==null?'—':(r.holdout_skill>0?'+':'')+r.holdout_skill.toFixed(2)}</div></div>
      <div class="tile acc"><div class="tl">CVaR plan / day</div>
        <div class="tv" style="font-size:17px">${inr(r.proposed_day)}</div></div>
    </div>
    <div style="font-size:11.5px;color:var(--muted);margin-top:8px;line-height:1.6">
      Now ${inr(r.current_day)}/day → plan <b>${inr(r.proposed_day)}</b>/day
      (${r.delta_day>=0?'+':'−'}${inr(Math.abs(r.delta_day))})${r.capped?' · at its 2× cap':''} ·
      90% response range ${rng.length?`${rng[0]} to ${rng[1]}`:'—'} · ${plan.scenarios} bootstrap scenarios
    </div>
    ${r.model_worse_than_baseline?warn(`<b>Our model predicts this SKU WORSE than a naive baseline</b> (skill ${r.holdout_skill.toFixed(2)}). The response estimate is the least reliable kind: precise-looking and possibly of the wrong thing.`):''}
    ${r.implausible_return?warn(`<b>${sym}${r.return_per_rupee.toFixed(2)} per ${sym}1 is implausibly high.</b> Read it as evidence FOR reverse causation — the regression crediting ads with demand that was already there — not as a great ad account.`):''}
    <div style="font-size:11.5px;color:var(--warn);margin-top:9px;line-height:1.55">
      <b>Direction is not identified.</b> Yesterday's demand predicts today's ad spend as strongly as spend
      predicts sales, so every figure here is conditional on the forward direction being the true one.
      Do not quote it to a seller.

}

/* ── SIGNAL-GRAPH NEIGHBOURHOOD (#4) ────────────────────────────────────────────────────────────
   /api/diagnose returns a CONCLUSION; this renders the EVIDENCE it reasoned over — one hop around
   the SKU in Neo4j. Built because the graph and the card engine can disagree with no way to see why:
   the graph called SKU-B0BHSZQG3P bullish while the rules engine flagged 19.3 days of cover. The
   neighbourhood shows the cause — the graph's only signal there is "Days of cover 15.58 → 19.3 (+24%)"
   marked GOOD, because it reasons on deltas (cover rose) while the card engine reasons on levels
   (19.3 days is still thin). Visible beats arguable.

   WHY A TIDY TREE RATHER THAN A NODE CLOUD. The obvious radial force layout is wrong for this data:
   the median SKU has 30 same-category peer edges, so a circle is a hairball in which the two signals
   that matter are invisible. The server already collapses peers to one counted node; here the survivors
   are laid out in fixed, grouped rows — deterministic coordinates, zero collisions at any node count,
   and the grouping carries the meaning the edge labels otherwise would.

   COLOUR IS NOT LOAD-BEARING. The DLS status tokens --crit and --warn measure ΔE 13.4 for NORMAL
   vision (3.8 deutan) — genuinely hard to separate. Repainting the app's palette is out of scope, so
   every node carries a glyph AND states its own direction in text ("Rating 4.29 → 4 (-7%)"), and the
   table view below repeats it all. Colour is confirmation, never the only channel. */
const SG_GROUPS=[
  {key:'why', label:'Why it moved',
   kinds:['Signal','MarketSignal','BuyBoxLoss','StockoutRisk','NegativeFeedbackCluster','Competitor']},
  {key:'act', label:'What we forecast and advised', kinds:['Prediction','Recommendation']},
  {key:'peer',label:'Your own catalogue', kinds:[]},
  {key:'ctx', label:'Context', kinds:['Channel','Category','Tenant','Marketplace','Listing','Seller',
                                      'MetricAnomaly','RootCause','Outcome']},
];
const SG_TONE={bad:{c:'var(--crit)',g:'▼',w:'adverse'}, watch:{c:'var(--warn)',g:'◆',w:'needs a look'},
               good:{c:'var(--pos)',g:'▲',w:'improving'}};
function sgTone(n){ return SG_TONE[n.tone]||{c:(n.structural?'var(--faint)':'var(--accent)'),
                                             g:(n.structural?'·':'○'), w:(n.structural?'context':'neutral')}; }
function sgGroupOf(n){
  if(n.aggregate||n.peer) return 'peer';
  return (SG_GROUPS.find(g=>g.kinds.includes(n.kind))||{key:'ctx'}).key;
}
function sgWrap(s,per,max){                       // SVG text does not wrap; split by words, hard-cap
  const out=[]; let line='';
  for(const w of String(s||'').split(/\s+/)){
    if((line+' '+w).trim().length>per){ if(line) out.push(line); line=w; if(out.length>=max) break; }
    else line=(line?line+' ':'')+w;
  }
  if(line&&out.length<max) out.push(line);
  if(out.length===max&&String(s).length>out.join(' ').length) out[max-1]=out[max-1].slice(0,per-1)+'…';
  return out;
}
/* Structural nodes of one kind carry almost nothing individually — five "sold on <channel>" rows are
   five rows saying "you sell on five channels", and they push the signals that matter off-screen. Same
   argument as the server-side peer collapse, applied client-side because these arrive individually. */
function sgCollapse(nodes){
  const out=[], bucket={};
  for(const n of nodes){
    if(!n.structural){ out.push(n); continue; }
    (bucket[n.kind]=bucket[n.kind]||[]).push(n);
  }
  for(const [kind,ns] of Object.entries(bucket)){
    if(ns.length<3){ out.push(...ns); continue; }
    const names=ns.map(n=>n.title);
    out.push({...ns[0], id:ns[0].id, count:ns.length, collapsed:names,
              title:`${ns.length} ${ns[0].label.toLowerCase()}s — ${names.slice(0,3).join(', ')}`
                    +(names.length>3?` +${names.length-3}`:'')});
  }
  return out;
}
function sgSVG(d){
  const nodes=sgCollapse((d.nodes||[]).filter(n=>!n.self)), self=(d.nodes||[]).find(n=>n.self)||{};
  const byId={}; (d.edges||[]).forEach(e=>{ const k=e.from==='self'?e.to:e.from; byId[k]=e; });
  const W=760, RX=322, RW=430, RH=27, GAP=5;
  let y=16; const rows=[];
  for(const g of SG_GROUPS){
    const ns=nodes.filter(n=>sgGroupOf(n)===g.key);
    if(!ns.length) continue;
    rows.push({hdr:g.label, y:y+11}); y+=25;
    for(const n of ns){ rows.push({n, y}); y+=RH+GAP; }
    y+=7;
  }
  const H=Math.max(y+8, 200), cy=Math.round(H/2), FX=8, FW=270;
  const st=sgWrap(self.title,32,3);
  // 3 stats, rounded, and hard-capped to the card width — at 10.5px mono, 270px holds ~46 chars.
  // Left unbounded this line ran past the card edge and clipped a number mid-digit ("· 92.2").
  const props=sgWrap(Object.entries(self.props||{}).slice(0,3)
    .map(([k,v])=>`${k==='price'?'₹':''}${Math.round(Number(v)*10)/10}${/_pct$/.test(k)?'%':''} `
                 +`${k.replace(/_pct$/,'').replace(/_/g,' ')}`).join(' · '), 44, 1);
  // Natural width, NOT width:100% — a 760-unit viewBox squeezed into the 560px drawer scaled every
  // label to ~66% and letterboxed dead space above and below. It renders at true size and .sgscroll
  // takes the overflow, per "wide content scrolls in its own container, the page never does".
  let svg=`<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img"
      aria-label="Signal graph neighbourhood for ${esc(d.sku||'')}: ${nodes.length} neighbours">`;
  // focus card
  const fh=Math.max(58, 26+st.length*15+(props.length?18:0));
  svg+=`<rect x="${FX}" y="${cy-fh/2}" width="${FW}" height="${fh}" rx="11" fill="var(--accent-bg)"
      stroke="var(--accent)" stroke-width="1.5"/>`;
  st.forEach((l,i)=>{ svg+=`<text x="${FX+13}" y="${cy-fh/2+21+i*15}" font-size="12.5" font-weight="600"
      fill="var(--accent-ink)">${esc(l)}</text>`; });
  if(props.length) svg+=`<text x="${FX+13}" y="${cy-fh/2+23+st.length*15}" font-size="10.5"
      font-family="var(--mono)" fill="var(--muted)">${esc(props[0])}</text>`;
  // edges first so node cards sit on top
  for(const r of rows){
    if(!r.n) continue;
    const y2=r.y+RH/2, x1=FX+FW, x2=RX, e=byId[r.n.id]||{};
    svg+=`<path d="M${x1} ${cy} C${x1+62} ${cy}, ${x2-62} ${y2}, ${x2} ${y2}" fill="none"
        stroke="${r.n.structural?'var(--line)':'var(--line)'}" stroke-width="${r.n.structural?1:1.6}"
        ${r.n.structural?'stroke-dasharray="3 3"':''} opacity="${r.n.structural?.7:1}"/>`;
    if(!e.undirected&&!r.n.structural)                            // arrowhead only where direction is real
      svg+=`<circle cx="${x2-4}" cy="${y2}" r="2.6" fill="var(--line)"/>`;
  }
  // group headers + node cards
  for(const r of rows){
    if(r.hdr){ svg+=`<text x="${RX}" y="${r.y}" font-size="9.5" font-family="var(--mono)"
        letter-spacing="1.1" fill="var(--faint)">${esc(r.hdr.toUpperCase())}</text>`; continue; }
    const n=r.n, t=sgTone(n), e=byId[n.id]||{};
    const cnt=(n.count>1&&!n.aggregate&&!n.collapsed)?` ×${n.count}`:'';   // title already states it
    const rel=esc(e.label||''), lbl=sgWrap(n.title+cnt,44,1)[0]||'';
    svg+=`<g><title>${esc(n.label)} — ${esc(n.title)}${cnt}${e.label?`\n${esc(e.label)} this product`:''}`
       +`${t.w?`\n${esc(t.w)}`:''}${n.aggregate?`\n${d.summary.flagged_peers} of ${n.count} carry adverse signals`:''}`
       +`${n.collapsed?`\n${esc(n.collapsed.join(', '))}`:''}</title>`
       +`<rect x="${RX}" y="${r.y}" width="${RW}" height="${RH}" rx="8" fill="${n.structural?'transparent':'var(--inner)'}"
          stroke="${n.structural?'var(--line-2)':'var(--line)'}"/>`
       +`<text x="${RX+11}" y="${r.y+18}" font-size="11.5" font-weight="700" fill="${t.c}">${t.g}</text>`
       +`<text x="${RX+27}" y="${r.y+18}" font-size="12" fill="${n.structural?'var(--muted)':'var(--ink-2)'}">${esc(lbl)}</text>`
       +`<text x="${RX+RW-11}" y="${r.y+18}" font-size="9.5" font-family="var(--mono)" text-anchor="end"
          fill="var(--faint)">${rel}</text></g>`;
  }
  return svg+'</svg>';
}
function sgHTML(d){
  const s=d.summary||{}, nodes=(d.nodes||[]).filter(n=>!n.self);
  const facts=[`${s.neighbours} neighbours`, s.adverse_signals?`${s.adverse_signals} adverse`:null,
    s.signals?`${s.signals} signal${s.signals===1?'':'s'}`:null, s.forecasts?`${s.forecasts} forecasts`:null,
    s.peers?`${s.peers} peers`:null, s.competitors?`${s.competitors} rival`:null].filter(Boolean);
  // LABELLED, and pushed away from the counts. Unlabelled tone chips sat immediately after
  // "9 neighbours · 1 signal · 14 forecasts", so "▲ improving" read as a VERDICT on the SKU — which
  // is badly wrong beside an "AT RISK" pill in the risk tab. It only ever means "this tone appears
  // below at least once".
  const tones=['bad','watch','good'].filter(k=>nodes.some(n=>n.tone===k));
  const legend=tones.length?`<span class="sgkey" title="A key to the marks used below — not a verdict on this product.">
    <span class="sgkeyl">legend</span>${tones.map(k=>
      `<span class="sgl"><b style="color:${SG_TONE[k].c}">${SG_TONE[k].g}</b> ${SG_TONE[k].w}</span>`).join('')}</span>`:'';
  const lag=(d.lead_lag||[]).length?`<div class="sgsec">Learned lead-lag</div>`
    +d.lead_lag.map(L=>`<div class="sglag"><span>${esc(L.from)}</span>
      <b title="${L.mutual?'Both directions are present in the graph, so this is correlation with an arbitrary direction — not a lead.':'This signal has historically preceded the next.'}">${L.mutual?'⇄':'⇒'}</b>
      <span>${esc(L.to)}</span>${L.mutual?'<em class="sgmut">both directions — correlation, not a lead</em>':''}</div>`).join(''):'';
  const table=`<details class="sgtab"><summary>View as a table</summary><table>
    <thead><tr><th>Type</th><th>Detail</th><th>Link</th><th>State</th></tr></thead><tbody>
    ${nodes.map(n=>{ const e=(d.edges||[]).find(x=>x.from===n.id||x.to===n.id)||{};
      return `<tr><td>${esc(n.label)}</td><td>${esc(n.title)}${n.count>1&&!n.aggregate?` ×${n.count}`:''}</td>
        <td>${esc(e.label||'')}</td><td>${esc(sgTone(n).w)}</td></tr>`; }).join('')}</tbody></table></details>`;
  return `<div class="sghead"><span class="sgfacts">${esc(facts.join(' · '))}</span>${legend}</div>
    <div class="sgscroll">${sgSVG(d)}</div>${lag}${table}
    <div class="sgnote">${esc(d.note||'')}</div>`;
}

/* CVaR AD-BUDGET REALLOCATION (#6) — behind the SAME double lock as the held ads model it rests on.

     1. why none of it is actionable (direction is not identified),
     2. what the RISK LEVEL does to the decision — the honest headline, because expected-value
        optimisation puts the whole budget on one SKU and a tail-aware one refuses to,
     3. the per-SKU plan, with the two flags that discredit individual lines.
   Tables, not charts: four risk rows and six SKUs are read faster as numbers, and a chart would lend
   unearned authority to figures whose causal direction we cannot establish. */

  catch(e){ host.innerHTML='<div style="color:var(--crit);font-size:12.5px;margin-top:8px">Could not reach the allocator.</div>';
            btn.disabled=false; btn.textContent='Reallocate the budget (CVaR)'; return; }

  const cav=(d.caveats||[]).map(c=>`<li style="margin-bottom:5px">${esc(c)}</li>`).join('');

  const sym=_sym(), inr=v=>sym+Math.round(v||0).toLocaleString('en-IN');
  const c=d.compare||{}, dw=d.data_window||{};
  const maxAbs=Math.max(...(d.rows||[]).map(r=>Math.abs(r.delta_day)),1);
  const bar=v=>{ const w=Math.round(46*Math.abs(v)/maxAbs);       // diverging: blue up / red down,
    const col=v>=0?'var(--accent)':'var(--crit)';                 // the CVD-validated pair, not red/green

      <span style="display:inline-block;height:8px;width:${w}px;background:${col};border-radius:2px"></span></span>`; };

    <table style="width:100%;border-collapse:collapse;font-size:12.5px">
      <thead><tr>${['Risk level','Spent','Held back','SKUs funded','Biggest share','Average/day','Worst-10%/day']
        .map((h,i)=>`<th style="text-align:${i?'right':'left'};padding:6px 8px;border-bottom:1px solid var(--line);font-size:11px;color:var(--faint);text-transform:uppercase;letter-spacing:.05em">${h}</th>`).join('')}</tr></thead>
      <tbody>${(d.risk_curve||[]).map(r=>{ const on=Math.abs(r.alpha-d.alpha)<1e-9;
        return `<tr style="border-bottom:1px solid var(--line-2);${on?'background:var(--accent-bg)':''}">

/* ---- minimal markdown (Realify's own renderer, shared with the classic widget) ---- */
function mdInline(s){ return s
  .replace(/`([^`]+)`/g,'<code>$1</code>')
  .replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')
  .replace(/(^|[^*])\*(?!\s)([^*]+?)\*/g,'$1<em>$2</em>')
  .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>'); }
function mdRender(src){
  // fenced code first, so its contents are never treated as markdown
  const fences=[]; let text=String(src==null?'':src).replace(/```(\w*)\n?([\s\S]*?)```/g,(m,lang,code)=>{
    fences.push(`<div class="codewrap"><button class="codecopy" data-code>Copy</button><pre>${esc(code.replace(/\n$/,''))}</pre></div>`);
    return `\n@@FENCE${fences.length-1}@@\n`; });
  const L=esc(text).split('\n'); let h='',i=0,list=null;
  const cl=()=>{ if(list){ h+='</'+list+'>'; list=null; } };
  while(i<L.length){ const t=L[i].trim();
    const fm=t.match(/^@@FENCE(\d+)@@$/); if(fm){ cl(); h+=fences[+fm[1]]||''; i++; continue; }
    if(/^\|.*\|?$/.test(t)&&i+1<L.length&&/^\|?[\s:|-]*-[\s:|-]*\|?$/.test(L[i+1].trim())){ cl();
      const cells=r=>r.trim().replace(/^\|/,'').replace(/\|$/,'').split('|').map(c=>c.trim());
      const head=cells(t); i+=2; let bd='';
      while(i<L.length&&/^\|.*\|?$/.test(L[i].trim())){ bd+='<tr>'+cells(L[i]).map(x=>'<td>'+mdInline(x)+'</td>').join('')+'</tr>'; i++; }
      h+='<table><thead><tr>'+head.map(x=>'<th>'+mdInline(x)+'</th>').join('')+'</tr></thead><tbody>'+bd+'</tbody></table>'; continue; }
    let m;
    if((m=t.match(/^(#{1,6})\s+(.*)$/))){ cl(); const n=m[1].length; h+='<h'+n+'>'+mdInline(m[2])+'</h'+n+'>'; i++; continue; }
    if(/^(-{3,}|\*{3,}|_{3,})$/.test(t)){ cl(); h+='<hr>'; i++; continue; }
    if((m=t.match(/^(?:>|&gt;)\s?(.*)$/))){ cl(); h+='<blockquote>'+mdInline(m[1])+'</blockquote>'; i++; continue; }
    if((m=t.match(/^[-*+]\s+(.*)$/))){ if(list!=='ul'){cl(); h+='<ul>'; list='ul';} h+='<li>'+mdInline(m[1])+'</li>'; i++; continue; }
    if((m=t.match(/^\d+\.\s+(.*)$/))){ if(list!=='ol'){cl(); h+='<ol>'; list='ol';} h+='<li>'+mdInline(m[1])+'</li>'; i++; continue; }
    if(t===''){ cl(); i++; continue; }
    // do/while: ALWAYS consume the current line before re-testing the guards. A plain `while` can
    // spin forever mid-stream — a table's header row arrives before its `|---|` separator, so the
    // table branch misses while the guard below rejects the leading `|`, and `i` never advances.
    cl(); const p=[];
    const brk=x=>/^(#{1,6}\s|>|&gt;|[-*+]\s|\d+\.\s|@@FENCE)/.test(x)||/^(-{3,}|\*{3,}|_{3,})$/.test(x);
    do{ p.push(L[i].trim()); i++; } while(i<L.length&&L[i].trim()!==''&&!brk(L[i].trim()));
    if(p.length) h+='<p>'+mdInline(p.join('<br>'))+'</p>'; }
  cl(); return h;
}
function wireCode(root){ (root||document).querySelectorAll('[data-code]').forEach(b=>{ if(b._w) return; b._w=1;
  b.onclick=()=>{ navigator.clipboard.writeText(b.parentElement.querySelector('pre').textContent);
    b.textContent='Copied'; setTimeout(()=>b.textContent='Copy',1200); }; }); }

function convGroup(iso){
  const d=new Date(iso), now=new Date(), day=864e5;
  const midnight=new Date(now.getFullYear(),now.getMonth(),now.getDate()).getTime();
  if(d.getTime()>=midnight) return 'Today';
  if(d.getTime()>=midnight-day) return 'Yesterday';
  if(d.getTime()>=midnight-6*day) return 'Previous 7 days';
  return 'Earlier';
}
function renderConvBar(){

  let last=null;
  for(const c of list){ const g=convGroup(c.updated_at||c.created_at);
    if(g!==last){ h+=`<div class="grp">${g}</div>`; last=g; }

      <button class="cx" data-del="${esc(c.id)}" title="Delete">&times;</button></div>`; }
  $('#convlist').innerHTML=h;

  $$('#convlist [data-del]').forEach(b=>b.onclick=async e=>{ e.stopPropagation();

async function submit(text, category){
  if(streaming) return;
  lastQ={text,category};
  ensureChatView();
  const chat=$('#chat');
  chat.insertAdjacentHTML('beforeend', `<div class="turn u"><div class="bub">${esc(text)}</div></div>`);
  const aid='a'+Date.now();
  chat.insertAdjacentHTML('beforeend',
    `<div class="turn a" id="${aid}"><div class="statusline" data-status><span class="sp"></span><span data-stxt>Thinking…</span></div>
     <div data-live></div><div class="bub"></div></div>`);
  const turn=$('#'+aid), bub=turn.querySelector('.bub');
  const status=turn.querySelector('[data-status]'), stxt=turn.querySelector('[data-stxt]'), live=turn.querySelector('[data-live]');
  stickBottom(true);
  setSending(true);
  abortCtl=new AbortController();
  let msgId=null, parts=[], raw='', calls=[], stopped=false;

  const paintLive=()=>{ // the agent's work, shown as it happens
    live.innerHTML = calls.length ? `<div class="trace open"><div class="trace-hd" data-tt>⚙︎ <b>Working</b>
      <span class="tmeta">${calls.length} step${calls.length===1?'':'s'}</span><span class="cv">›</span></div>
      <div class="trace-bd">${calls.map(traceStepHTML).join('')}</div></div>` : '';
    wireTrace(live); };

  try{
    const res=await fetch('/api/ask',{method:'POST',headers:{'Content-Type':'application/json'},
      signal:abortCtl.signal,
      body:JSON.stringify({message:text, category:category||null, conversation_id:convId, model_id:MODEL_ID})});
    const reader=res.body.getReader(); const dec=new TextDecoder(); let buf='';
    while(true){ const {value,done}=await reader.read(); if(done) break; buf+=dec.decode(value,{stream:true});
      let idx; while((idx=buf.indexOf('\n\n'))>=0){ const line=buf.slice(0,idx).trim(); buf=buf.slice(idx+2);
        if(!line.startsWith('data:')) continue;
        let ev; try{ ev=JSON.parse(line.slice(5).trim()); }catch{ continue; }
        if(ev.type==='meta'){ if(ev.conversation_id) convId=ev.conversation_id; if(ev.message_id) msgId=ev.message_id; }
        else if(ev.type==='status'){ if(ev.text) stxt.textContent=ev.text; }
        else if(ev.type==='tool'){ calls.push(ev.call||{}); stxt.textContent=(ev.call&&ev.call.label)||'Running a tool…'; paintLive(); stickBottom(); }
        else if(ev.type==='verdict'){ stxt.textContent='Verifying every figure…'; }
        else if(ev.type==='delta'){ if(status.parentNode) status.remove();
          raw+=ev.text; bub.innerHTML=mdRender(raw)+'<span class="curs"></span>'; stickBottom(); }
        else if(ev.type==='part'){ parts.push(ev.part); }
        else if(ev.type==='usage'){ USAGE=ev.usage||USAGE; }
        else if(ev.type==='error'){ if(status.parentNode) status.remove();
          bub.innerHTML=`<span style="color:var(--crit)">${esc(ev.message||'Something went wrong.')}</span>`; }
      } }
  }catch(e){
    if(e&&e.name==='AbortError'){ stopped=true; }
    else { if(status.parentNode) status.remove();
      bub.innerHTML=`<span style="color:var(--crit)">Something went wrong. Try again.</span>`; }
  }
  if(status.parentNode) status.remove();
  bub.innerHTML = raw ? mdRender(raw) : bub.innerHTML;
  if(stopped && raw) bub.insertAdjacentHTML('beforeend','<p class="tmeta">Stopped.</p>');
  live.innerHTML='';                                  // the finished trace re-renders inside renderParts
  wireCode(bub);
  setSending(false); abortCtl=null;
  renderParts(turn, parts, msgId, text);
  $$('.ombox .usage').forEach(u=>u.style.width=usagePct()+'%');
  $$('.ombox .usage-lbl').forEach(l=>l.textContent=`${USAGE.used||0}/${USAGE.cap||100} this month`);
  await loadConvs(); renderConvBar();
  if(speakOn && raw && !stopped) speak(bub.textContent);
}

/* one step of the agent trace — for query_cdp this is the actual SQL it wrote */
function traceStepHTML(c){
  const bits=[];
  if(c.row_count!=null) bits.push(`${c.row_count} row${c.row_count===1?'':'s'}`);
  if(c.backend) bits.push(esc(c.backend));
  if(c.sku) bits.push(esc(c.sku));
  if(c.ok===false) bits.push('failed');
  let h=`<div class="tstep"><b>${esc(c.label||c.name||'Step')}</b>${bits.length?` <span class="tmeta">· ${bits.join(' · ')}</span>`:''}</div>`;
  if(c.sql) h+=`<div class="sqlblock">${esc(c.sql)}</div>`;
  if(c.error) h+=`<div class="tstep" style="color:var(--crit)">${esc(c.error)}</div>`;
  if(c.explanation) h+=`<div class="tstep">${esc(c.explanation)}</div>`;
  if(c.accuracy) h+=`<div class="tstep tmeta">${esc(c.accuracy)}</div>`;
  return h;
}
function wireTrace(root){ (root||document).querySelectorAll('[data-tt]').forEach(hd=>{ if(hd._w) return; hd._w=1;
  hd.onclick=()=>hd.closest('.trace').classList.toggle('open'); }); }
function confHTML(p){
  const tone=({verified:'var(--pos)',derived:'var(--accent)',estimated:'var(--warn)',inferred:'var(--warn)'})[p.tier]||'var(--muted)';
  const g=(p.grounded_pct!=null)?`${Math.round(p.grounded_pct)}% of figures traced to your data`:'';
  const tools=(p.tools||[]).length?` · ${p.tools.length} tool${p.tools.length===1?'':'s'}`:'';
  return `<div class="conf" title="${esc(p.note||'')}"><span class="dot" style="background:${tone}"></span>
    <b>${esc(p.label||p.tier||'Checked')}</b>${g?` · ${esc(g)}`:''}${tools}</div>`;
}

    else if(p.type==='tiles') extra+=`<div class="tiles">${p.tiles.map(t=>`<div class="tile ${t.tone==='critical'?'':'acc'}"><div class="tl">${esc(t.label)}</div><div class="tv">${esc(t.value)}</div></div>`).join('')}</div>`;
    else if(p.type==='citations') extra+=`<div class="cites">${p.items.map(c=>`<div class="cite"><span class="sev" style="background:${sevColor(c.severity)}"></span><span>${esc(c.finding)}</span>${c.exposure_val?`<b style="margin-left:auto">${esc(c.exposure_val)}</b>`:''}</div>`).join('')}</div>`;

  turn.querySelector('[data-copy]').onclick=e=>{ navigator.clipboard.writeText(bubText);
    e.target.textContent='⧉ Copied'; setTimeout(()=>e.target.textContent='⧉ Copy',1200); };
  turn.querySelector('[data-speak]').onclick=()=>{ unlockAudio(); speak(bubText); };
