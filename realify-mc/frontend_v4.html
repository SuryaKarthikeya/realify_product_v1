function sevColor(s){ return ({crit:'var(--crit)',act:'var(--warn)',opp:'var(--pos)'})[s]||'var(--muted)'; }

/* ---- voice: RIA's own STT/TTS (Meher clone on the DGX), with a graceful local fallback ---- */
function unlockAudio(){ // must run inside a user gesture or the browser blocks later playback
  try{ if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==='suspended') audioCtx.resume(); }catch(e){} }
async function speak(text){
  text=(text||'').trim(); if(!text) return;
  unlockAudio();
  try{
    const r=await fetch('/api/voice/tts',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({text:text.slice(0,700)})});
    if(!r.ok) throw new Error('tts');
    const buf=await audioCtx.decodeAudioData(await r.arrayBuffer());
    const s=audioCtx.createBufferSource(); s.buffer=buf; s.connect(audioCtx.destination); s.start();
  }catch(e){ // voice service down (it lives on the DGX) — fall back to the platform voice
    try{ speechSynthesis.cancel(); speechSynthesis.speak(new SpeechSynthesisUtterance(text)); }catch(_){}
  }
}
async function dictate(btn, ta){
  if(micOn){ micOn=false; return; }
  if(!navigator.mediaDevices||!window.MediaRecorder){ alert('Dictation needs a browser with microphone support.'); return; }
  unlockAudio();
  let stream; try{ stream=await navigator.mediaDevices.getUserMedia({audio:true}); }
  catch(e){ alert('Microphone blocked — allow mic access to dictate.'); return; }
  micOn=true; btn.classList.add('rec'); btn.textContent='■';
  const mr=new MediaRecorder(stream), chunks=[];
  mr.ondataavailable=e=>{ if(e.data.size) chunks.push(e.data); };
  mr.onstop=async()=>{
    stream.getTracks().forEach(t=>t.stop()); micOn=false; btn.classList.remove('rec'); btn.textContent='⏳';
    try{
      const r=await fetch('/api/voice/stt',{method:'POST',
        headers:{'Content-Type':'application/octet-stream','x-audio-ext':'webm'},body:new Blob(chunks,{type:'audio/webm'})});
      const t=((await r.json()).text||'').trim();
      if(t){ ta.value=t; ta.dispatchEvent(new Event('input',{bubbles:true})); submit(t); }
    }catch(e){}
    btn.textContent='🎤';
  };
  mr.start(120);
  // stop on the next click, or after 15s of recording
  const stop=()=>{ try{ mr.stop(); }catch(e){} };
  btn.onclick=()=>{ stop(); btn.onclick=()=>dictate(btn,ta); };
  setTimeout(()=>{ if(mr.state==='recording') stop(); },15000);
}

/* ============ right pane ============ */
const PANE_TABS=[['rules','Rules'],['followups','Follow-ups'],['actions','Action list'],['history','History'],['notifs','Notifications']];
let paneTab='followups';
function openPane(){ $('#pane').classList.add('show'); $('#scrim').classList.add('show'); renderPane(); }
function closePane(){ $('#pane').classList.remove('show'); $('#scrim').classList.remove('show'); }
function renderPane(){
  $('#paneTabs').innerHTML = PANE_TABS.map(([k,l])=>`<button class="${paneTab===k?'on':''}" data-pt="${k}">${l}</button>`).join('');
  $$('#paneTabs [data-pt]').forEach(b=>b.onclick=()=>{paneTab=b.dataset.pt; renderPane();});
  const body=$('#paneBody'); body.innerHTML='<div class="empty">Loading…</div>';
  if(paneTab==='followups') fetch('/api/ask/followups').then(r=>r.json()).then(d=>{
    body.innerHTML=(d.followups||[]).length?d.followups.map(f=>`<div class="li">${esc(f.snippet||'(saved response)')}<div class="m">${new Date(f.created_at).toLocaleString()}</div></div>`).join(''):'<div class="empty">Nothing marked yet. Mark a response with ★ Follow-up.</div>';
  }).catch(()=>body.innerHTML='<div class="empty">—</div>');
  else if(paneTab==='history') fetch('/api/ask/conversations').then(r=>r.json()).then(d=>{
    body.innerHTML=(d.conversations||[]).length?d.conversations.map(c=>`<div class="li" data-conv="${c.id}" style="cursor:pointer">${esc(c.title||'Conversation')}<div class="m">${new Date(c.updated_at).toLocaleString()}</div></div>`).join(''):'<div class="empty">No conversations yet.</div>';
    body.querySelectorAll('[data-conv]').forEach(b=>b.onclick=()=>openConv(b.dataset.conv));
  }).catch(()=>body.innerHTML='<div class="empty">—</div>');
  else if(paneTab==='rules') renderRulesTab(body);
  else if(paneTab==='actions') fetch('/api/log').then(r=>r.json()).then(d=>{
    const rows=(d.log||d.entries||(Array.isArray(d)?d:[]));
    body.innerHTML=rows.length?rows.slice(0,40).map(x=>`<div class="li"><b>${esc(x.title||x.action||'Action')}</b>${x.summary?`<div style="color:var(--muted);margin-top:3px">${esc(x.summary)}</div>`:''}<div class="m">${esc(x.card_type||'')} ${x.ts?new Date(x.ts).toLocaleString():''}</div></div>`).join(''):'<div class="empty">No actions recorded yet. Applying a recommendation logs it here.</div>';
  }).catch(()=>body.innerHTML='<div class="empty">—</div>');
  else if(paneTab==='notifs') fetch('/api/log').then(r=>r.json()).then(d=>{
    const rows=(d.log||d.entries||d||[]); const arr=Array.isArray(rows)?rows:[];
    body.innerHTML=arr.length?arr.slice(0,30).map(x=>`<div class="li">${esc(x.note||x.message||x.event||JSON.stringify(x).slice(0,80))}<div class="m">${x.at||x.ts||''}</div></div>`).join(''):'<div class="empty">No recent activity.</div>';
  }).catch(()=>body.innerHTML='<div class="empty">No recent activity.</div>');
}
let ruleEdits={};
async function renderRulesTab(body){
  body.innerHTML='<div class="empty">Loading detectors…</div>'; ruleEdits={};
  let d={}; try{ d=await fetch('/api/settings/detectors').then(r=>r.json()); }catch(e){}
  const dets=d.detectors||[]; const groups=d.groups||[...new Set(dets.map(x=>x.group))];
  if(!dets.length){ body.innerHTML='<div class="empty">No detectors available.</div>'; return; }
  body.innerHTML=`<div style="font-size:12.5px;color:var(--muted);margin-bottom:12px">Tune what Realify watches — thresholds, on/off, and how each surfaces. Changes apply to your account.</div>`+
    groups.map(g=>{ const inG=dets.filter(x=>x.group===g); if(!inG.length) return '';
      return `<div class="sec-h">${esc(g)}</div>`+inG.map(x=>{
        const th=x.threshold;
        return `<div class="li"><div style="display:flex;align-items:center;gap:8px"><b>${esc(x.name)}</b>
          <label style="margin-left:auto;font-size:11px;color:var(--muted);cursor:pointer"><input type="checkbox" data-det="${esc(x.detector)}" data-enable ${x.enabled?'checked':''}> on</label></div>
          ${x.watches?`<div style="color:var(--muted);font-size:12px;margin-top:4px">${esc(x.watches)}</div>`:''}
          <div style="display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap">
            ${th?`<label style="font-size:11.5px">Threshold <input type="number" data-det="${esc(x.detector)}" data-thr value="${th.value!=null?th.value:''}" ${th.min!=null?`min="${th.min}"`:''} ${th.max!=null?`max="${th.max}"`:''} step="any" style="width:80px;border:1px solid var(--line);border-radius:6px;padding:3px 6px;background:var(--panel);color:var(--ink)"> ${esc(th.label||'')}</label>`:'<span style="font-size:11.5px;color:var(--faint)">No numeric threshold — on/off only.</span>'}
            <label style="font-size:11.5px;margin-left:auto">Surface as <select data-det="${esc(x.detector)}" data-sev style="border:1px solid var(--line);border-radius:6px;padding:3px 6px;background:var(--panel);color:var(--ink)">${[['act','Act'],['watch','Watch'],['opp','Opportunity']].map(([v,l])=>`<option value="${v}" ${x.severity===v?'selected':''}>${l}</option>`).join('')}</select></label>
          </div></div>`;
      }).join('');
    }).join('')+
    `<div style="position:sticky;bottom:0;background:var(--panel);padding-top:10px;margin-top:6px"><button class="mbtn primary" id="rulesApply" style="width:100%">Apply changes &amp; rebuild feed</button><div id="rulesMsg" style="font-size:12px;color:var(--muted);margin-top:6px;text-align:center"></div></div>`;
  const edit=(det)=>{ ruleEdits[det]=ruleEdits[det]||{...(dets.find(x=>x.detector===det)||{})}; return ruleEdits[det]; };
  body.querySelectorAll('[data-enable]').forEach(el=>el.onchange=()=>{ edit(el.dataset.det).enabled=el.checked; });
  body.querySelectorAll('[data-thr]').forEach(el=>el.oninput=()=>{ edit(el.dataset.det).threshold=parseFloat(el.value); });
  body.querySelectorAll('[data-sev]').forEach(el=>el.onchange=()=>{ edit(el.dataset.det).severity=el.value; });
  $('#rulesApply').onclick=async()=>{
    const msg=$('#rulesMsg'); const ids=Object.keys(ruleEdits);
    if(!ids.length){ msg.textContent='No changes to apply.'; return; }
    msg.textContent='Applying…';
    for(const det of ids){ const e=ruleEdits[det]; await fetch('/api/settings/detectors',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({detector:det,enabled:e.enabled,severity:e.severity,threshold:e.threshold})}); }
    await fetch('/api/settings/rebuild',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'}).catch(()=>{});
    // poll rebuild status briefly
    let done=false; for(let i=0;i<30&&!done;i++){ await new Promise(r=>setTimeout(r,400)); try{ const s=await fetch('/api/settings/rebuild/status').then(r=>r.json()); done=s.done||s.idle; }catch(e){ done=true; } }
    msg.style.color='var(--pos)'; msg.textContent='Rules applied ✓'; ruleEdits={};
    if(SURFACE==='intel'&&SUB.intel==='intelligence') renderSurface();
  };
}
async function openConv(id){
  const d=await fetch('/api/ask/conversations/'+id).then(r=>r.json()); if(!d.ok) return;
  if(SURFACE!=='ask') go('ask');
  closePane();
  convId=id;
  // rebuild the surface so the conversation rail stays alongside the transcript
  $('#surface').innerHTML = `<div class="askwrap">${convBarHTML()}<div class="askmain" id="askmain">
    <div class="chat" id="chat"></div><div class="chatdock">${omniHTML('dockOmni')}</div></div></div>`;
  wireConvBar(); wireOmni('dockOmni');
  const chat=$('#chat');
  for(const m of d.messages){
    if(m.role==='user'){ chat.insertAdjacentHTML('beforeend',`<div class="turn u"><div class="bub">${esc(m.content)}</div></div>`); lastQ={text:m.content,category:m.category}; }
    else { const aid='h'+Math.random().toString(36).slice(2);
      chat.insertAdjacentHTML('beforeend',`<div class="turn a" id="${aid}"><div class="bub">${mdRender(m.content)}</div></div>`);
      renderParts($('#'+aid), m.parts||[], m.id, ''); } }
  stickBottom(true);
}

/* ============ profile menu ============ */

  const role=[ME.account_type==='tester'?'Realify tester':null, ME.role==='owner'?'Owner':null].filter(Boolean).join(' · ');

  m.querySelector('#logoutBtn').onclick=()=>fetch('/api/logout',{method:'POST'}).then(()=>location.href='/');

/* ============ boot ============ */
async function boot(){
  try{ ME=await fetch('/api/me').then(r=>r.json()); }catch(e){ ME={}; }
  if(ME&&ME.name) $('#avatarBtn').textContent=(ME.name[0]||'R').toUpperCase();
  const feat=ME.features||{};
  if(feat.ask!==false) await loadAsk();
  renderRail();
  go(feat.ask!==false ? 'ask' : 'intel');   // Ask is home when enabled; else Intel
  // freshness label (best-effort)
  fetch('/api/status').then(r=>r.json()).then(s=>{ if(s&&s.last_at) $('#freshLbl').textContent='updated '+timeAgo(s.last_at); }).catch(()=>{});
}
function timeAgo(t){ try{ const d=(Date.now()-new Date(t))/36e5; return d<1?'just now':(d<24?Math.round(d)+'h ago':Math.round(d/24)+'d ago'); }catch(e){ return '—'; } }
$('#paneBtn').onclick=openPane; $('#paneX').onclick=closePane; $('#scrim').onclick=()=>{closePane();closeMenus();};
$('#avatarBtn').onclick=avatarMenu;
$('#themeBtn').onclick=()=>{ const r=document.documentElement; r.dataset.theme=r.dataset.theme==='dark'?'light':'dark'; };
$('#railToggle').onclick=()=>$('#app').classList.toggle('railmin');
$('#railBurger').onclick=()=>$('#app').classList.toggle('railopen');
function gotoAsk(){ if((ME.features||{}).ask===false){ go('intel'); return; } go('ask'); setTimeout(()=>$('.ombox textarea')?.focus(),60); }
$('#omniMini').onclick=gotoAsk;
document.addEventListener('keydown',e=>{ if((e.metaKey||e.ctrlKey)&&e.key==='k'){e.preventDefault(); gotoAsk();} if(e.key==='Escape'){closeMenus();closePane();} });
document.addEventListener('click',e=>{ if(!e.target.closest('.menu')&&!e.target.closest('#avatarBtn')&&!e.target.closest('[data-mp]')) closeMenus(); });
if(innerWidth<=720) $('#railBurger').style.display='inline-flex';
boot();
</script>
