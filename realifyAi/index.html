<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Realify Ai | Marketplace Intelligence</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <script src="https://cdn.plot.ly/plotly-3.1.1.min.js"></script>
    <style>
      body, input, button, select, textarea {
        font-family: 'Inter', sans-serif;
      }
      ::-webkit-scrollbar {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Paint the theme before React boots, so there is no flash of the wrong
      // one. Mirrors resolveDark() in src/store/useThemeStore.js — 'custom'
      // follows the OS — and uses the same colours, so the store's reconcile
      // pass on load is a no-op rather than a visible correction.
      (function() {
        var theme = localStorage.getItem('theme');
        var isDark = theme === 'dark' || (theme === 'custom' &&
          window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', isDark);
        document.body.classList.toggle('dark', isDark);
        document.body.style.backgroundColor = isDark ? '#0c101a' : '#ffffff';
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
